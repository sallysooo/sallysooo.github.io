name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Edits from /admin (and the daily tech-blog sync) can land seconds apart;
# run deploys one at a time so an older build never overwrites a newer one.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node 🟢
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install 🔧
        run: npm ci

      - name: Build 🏗️
        run: npm run build

      # BrowserRouter needs every path to serve index.html; GitHub Pages'
      # static hosting doesn't have server-side rewrites, so give it a
      # 404.html fallback that's just index.html (see dev-portfolio's README).
      - name: SPA fallback for deep links 🔗
        run: cp build/index.html build/404.html

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build
