name: Sync tech blog

on:
  schedule:
    # 15:00 UTC = 00:00 KST
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node 🟢
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest Tistory posts 📥
        run: node scripts/sync-tech-blog.mjs

      - name: Commit and push if changed 🚀
        run: |
          if git diff --quiet -- public/profile/tech-blog.json; then
            echo "No new tech blog posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/profile/tech-blog.json
          git commit -m "Sync tech blog posts from Tistory"
          git push
